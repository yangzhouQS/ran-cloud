[package]
name = "ran-rs-desktop"
version = "0.1.0"
description = "A Tauri + Rsbuild + Vue 3 Desktop Application"
authors = ["you"]
edition = "2021"

[lib]
name = "ran_rs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# === Tauri ===
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

# === Serialization ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# === Async Runtime ===
tokio = { version = "1", features = ["full"] }

# === Error Handling ===
thiserror = "2"
anyhow = "1"

# === Async Trait ===
async-trait = "0.1"

# === Redis Client ===
redis = { version = "0.27", features = ["tokio-comp", "cluster", "cluster-async", "sentinel"] }
# TLS 支持（Phase 2+ 启用）
# redis = { version = "0.27", features = ["tokio-comp", "cluster", "cluster-async", "sentinel", "tls-rustls"] }
# tokio-rustls = "0.26"

# === SSH Tunnel ===
ssh2 = "0.9"

# === Logging ===
log = "0.4"
env_logger = "0.11"

# === UUID ===
uuid = { version = "1", features = ["v4", "serde"] }

# === DashMap (concurrent HashMap) ===
dashmap = "6"

# === Lazy Static ===
once_cell = "1"

# === Version Comparison ===
semver = "1"

[dev-dependencies]
tempfile = "3"
