[package]
name = "ran-rs-desktop"
version = "0.1.0"
description = "A Tauri + Rsbuild + Vue 3 Desktop Application"
authors = ["you"]
edition = "2021"

[lib]
name = "ran_rs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# === Tauri ===
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

# === Serialization ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# === Async Runtime ===
tokio = { version = "1", features = ["full"] }

# === Error Handling ===
thiserror = "2"
anyhow = "1"

# === Async Trait ===
async-trait = "0.1"

# === Redis Client ===
redis = { version = "0.27", features = ["tokio-comp", "cluster", "cluster-async", "sentinel"] }
# TLS 支持（Phase 2+ 启用）
# redis = { version = "0.27", features = ["tokio-comp", "cluster", "cluster-async", "sentinel", "tls-rustls"] }
# tokio-rustls = "0.26"

# === SSH Tunnel ===
ssh2 = "0.9"

# === Logging ===
log = "0.4"
env_logger = "0.11"

# === UUID ===
uuid = { version = "1", features = ["v4", "serde"] }

# === DashMap (concurrent HashMap) ===
dashmap = "6"

# === Lazy Static ===
once_cell = "1"

# === SQL Database Drivers ===
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-postgres = "0.7"
postgres = "0.19"
mysql_async = { version = "0.34", features = ["native-tls-tls"] }
chrono = { version = "0.4", features = ["serde"] }

# === Version Comparison ===
semver = "1"

# === TLS for SQL Drivers ===
tokio-native-tls = "0.3"
native-tls = "0.2"
postgres-native-tls = "0.5"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "query_benchmark"
harness = false
